<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c00f7d" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Square Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="url(#primaryGrad)" stroke-width="8" stroke-opacity="0.6" />

  <!-- Speed-Variation Trajectory Curve & Nodes -->
  <g>
    <!-- Dynamic Trajectory Streamlines -->
    <path d="M 96 352 C 160 352, 200 270, 256 256 C 312 242, 352 160, 416 160" 
          fill="none" stroke="url(#primaryGrad)" stroke-width="40" stroke-linecap="round" />
    <path d="M 120 180 C 180 180, 210 240, 256 256 C 302 272, 340 330, 392 330" 
          fill="none" stroke="url(#sparkGrad)" stroke-width="22" stroke-linecap="round" opacity="0.9" />

    <!-- Trajectory Point Sparks -->
    <circle cx="256" cy="256" r="32" fill="#ffffff" filter="url(#glow)" />
    <circle cx="256" cy="256" r="20" fill="url(#primaryGrad)" />
    
    <circle cx="416" cy="160" r="24" fill="#38bdf8" />
    <circle cx="96" cy="352" r="24" fill="#c00f7d" />
  </g>
</svg>
